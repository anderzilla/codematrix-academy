<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<style>
  :root{--bg:#fbfaf7;--ink:#17161a;--muted:#5b5860;--acc:#1f6f5c;--card:#fff;--line:#e6e2da}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:760px;margin:0 auto;padding:40px 20px 120px}
  header{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  h1{font-size:clamp(30px,6vw,44px);line-height:1.12;margin:18px 0 10px}
  h3{font-weight:500;color:var(--muted);font-size:20px;margin:0 0 28px}
  h2{font-size:24px;margin:44px 0 12px;padding-top:20px;border-top:1px solid var(--line)}
  ul,ol{padding-left:22px} li{margin:6px 0}
  .cta{display:block;text-align:center;background:var(--acc);color:#fff;text-decoration:none;font-weight:700;
       padding:18px;border-radius:10px;margin:32px 0;font-size:18px}
  .fixo{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
  .fixo .cta{margin:0 auto;max-width:760px}
  footer{margin-top:60px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
<header>{{MARCA}}</header>
{{CORPO}}
<a class="cta" href="{{CHECKOUT}}">Quero garantir minha vaga na pré-venda</a>
<footer>Pagamento e entrega processados pela plataforma. Garantia conforme descrito acima.</footer>
</main>
<div class="fixo"><a class="cta" href="{{CHECKOUT}}">Entrar na pré-venda</a></div>
</body>
</html>
